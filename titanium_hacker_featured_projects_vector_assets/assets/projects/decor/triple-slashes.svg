        <stop offset="62%" stop-color="#B6FF3B" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#42535C" stop-opacity=".6"/>
      </linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
