name: Latest blog post workflow
on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Rebuild profile assets and README
        run: |
          python scripts/build.py

      - name: Run verification test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Commit updated blog assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/writing/ README.md data/blog_cache.json
          if git diff --staged --quiet; then
            echo "No blog changes detected; skipping commit."
          else
            git commit -m "chore(blog): automated daily blog post update [skip ci]"
            git push
          fi
