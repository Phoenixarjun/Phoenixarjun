<svg xmlns="http://www.w3.org/2000/svg" width="328" height="144" viewBox="0 0 328 144" role="img" aria-label="Subtle technical dot grid — transparent accent for Featured Projects header">
<title>Subtle technical dot grid — transparent accent for Featured Projects header</title>
<defs>
      <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#253139" stop-opacity=".94"/>
        <stop offset="100%" stop-color="#1B2328" stop-opacity=".88"/>
      </linearGradient>
      <linearGradient id="limeEdge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#42535C" stop-opacity=".6"/>
        <stop offset="62%" stop-color="#B6FF3B" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#42535C" stop-opacity=".6"/>
      </linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#B6FF3B" stop-opacity="0"/>
        <stop offset=".48" stop-color="#B6FF3B" stop-opacity=".84"/>
        <stop offset="1" stop-color="#B6FF3B" stop-opacity="0"/>
      </linearGradient>
      <filter id="softGlow" x="-85%" y="-85%" width="270%" height="270%">
        <feGaussianBlur stdDeviation="5" />
      </filter>
      <filter id="subtleGlow" x="-85%" y="-85%" width="270%" height="270%">
        <feGaussianBlur stdDeviation="2.4" />
      </filter>
      <pattern id="quietDots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r=".85" fill="#42535C" opacity=".42" />
      </pattern>
    </defs>
