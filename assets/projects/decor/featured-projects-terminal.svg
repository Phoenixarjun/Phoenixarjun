<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="52" viewBox="0 0 1160 52" role="img" aria-label="Terminal heading for Featured Projects — transparent background">
<title>Terminal heading for Featured Projects — transparent background</title>
<defs>
      <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#253139" stop-opacity=".94"/>
        <stop offset="100%" stop-color="#1B2328" stop-opacity=".88"/>
      </linearGradient>
      <linearGradient id="limeEdge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#42535C" stop-opacity=".6"/>
        <stop offset="62%" stop-color="#B6FF3B" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#42535C" stop-opacity=".6"/>
      </linearGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#B6FF3B" stop-opacity="0"/>
        <stop offset=".48" stop-color="#B6FF3B" stop-opacity=".84"/>
        <stop offset="1" stop-color="#B6FF3B" stop-opacity="0"/>
      </linearGradient>
      <filter id="softGlow" x="-85%" y="-85%" width="270%" height="270%">
        <feGaussianBlur stdDeviation="5" />
      </filter>
      <filter id="subtleGlow" x="-85%" y="-85%" width="270%" height="270%">
        <feGaussianBlur stdDeviation="2.4" />
      </filter>
      <pattern id="quietDots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r=".85" fill="#42535C" opacity=".42" />
      </pattern>
    </defs>
<path d="M 10 14 L 24 26 L 10 38" stroke="#B6FF3B" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<text x="46" y="32" fill="#B6FF3B" font-size="20" font-weight="700" font-family="JetBrains Mono, DejaVu Sans Mono, Consolas, monospace" >naresh@github:~$</text>
<text x="289" y="32" fill="#EEF7EF" font-size="20" font-weight="500" font-family="JetBrains Mono, DejaVu Sans Mono, Consolas, monospace" >ls --flagship-projects</text>
<path d="M 600 26 H 1130" stroke="#42535C" fill="none" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="1138" cy="26" r="3" fill="#B6FF3B" stroke="none" stroke-width="1" />
</svg>
