<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="224" viewBox="0 0 1160 224" role="img" aria-label="Transparent-canvas titanium project row frame with bevel and two corner accents">
<title>Transparent-canvas titanium project row frame with bevel and two corner accents</title>
<defs>
      <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#253139" stop-opacity=".94"/>
        <stop offset="100%" stop-color="#1B2328" stop-opacity=".88"/>
      </linearGradient>
      <linearGradient id="limeEdge" x1="0" y1="0" x2="1" y2="1">
