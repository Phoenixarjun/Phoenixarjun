<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="220" viewBox="0 0 1160 220" role="img" aria-label="System Runner playground concept">
<title>System Runner playground concept</title>
<defs>
  <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0C0F10"/>
    <stop offset="1" stop-color="#1B2328"/>
  </linearGradient>
  <linearGradient id="edgeGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B6FF3B" stop-opacity=".6"/>
    <stop offset="1" stop-color="#42535C" stop-opacity=".5"/>
  </linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r=".7" fill="#8EADB6" opacity=".38"/>
  </pattern>
</defs>
<rect width="1160" height="220" rx="18" fill="url(#panelGradient)"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity=".35"/>
<rect x="1.5" y="1.5" width="1157" height="217" rx="17" fill="none" stroke="url(#edgeGradient)" stroke-width="2"/>
