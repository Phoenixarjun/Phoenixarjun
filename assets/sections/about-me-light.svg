<g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace" font-size="16.5">
  <text x="90" y="98" font-weight="700" fill="#3B6600"># About Me</text>

  <text x="90" y="126" fill="#11171A">I'm a <tspan fill="#3B6600" font-weight="700">Software Engineer at Prodapt</tspan>, working on backend systems, distributed data pipelines,</text>
  <text x="90" y="154" fill="#11171A">and production infrastructure.</text>

  <text x="90" y="210" fill="#11171A">I'm particularly interested in what makes intelligent software reliable. Beyond integrating AI models,</text>
  <text x="90" y="238" fill="#11171A">I enjoy exploring the systems around them: <tspan fill="#586A73">architecture, data flows, failure handling, observability,</tspan></text>
  <text x="90" y="266" fill="#11171A">and the engineering decisions that make software dependable.</text>

  <text x="90" y="322" fill="#11171A">Outside work, I build applied AI projects and open-source developer tools, experiment with new</text>
  <text x="90" y="350" fill="#11171A">engineering approaches, and write about the lessons and trade-offs behind them.</text>

  <text x="90" y="406" fill="#11171A">I'm the kind of engineer who wants to understand <tspan fill="#3B6600" font-weight="700">why something works, what happens when it fails,</tspan></text>
  <text x="90" y="434" font-weight="700" fill="#3B6600">and how it can be designed better.<tspan fill="#586A73" font-weight="400">_</tspan></text>
</g>

