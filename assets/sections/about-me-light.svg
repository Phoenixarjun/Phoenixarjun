<text x="606" y="560" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#586A73">Build → Measure → Observe → Iterate to create intelligent,</text>
<text x="606" y="588" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#586A73">resilient, and high-impact software systems.</text>

