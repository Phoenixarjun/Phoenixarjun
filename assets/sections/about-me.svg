<text x="606" y="574" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8EADB6">Build → Measure → Observe → Iterate — to create intelligent,</text>
<text x="606" y="596" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#8EADB6">resilient, and high-impact software systems.</text>

