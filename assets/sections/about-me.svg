<g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace" font-size="13.2">
  <text x="110" y="110" font-weight="700" fill="#B6FF3B"># About Me</text>

  <text x="110" y="134" fill="#EEF7EF">I'm a <tspan fill="#B6FF3B" font-weight="700">Software Engineer at Prodapt</tspan>, working on backend systems, distributed data pipelines,</text>
  <text x="110" y="156" fill="#EEF7EF">and production infrastructure.</text>

  <text x="110" y="200" fill="#EEF7EF">I'm particularly interested in what makes intelligent software reliable. Beyond integrating AI models,</text>
  <text x="110" y="222" fill="#EEF7EF">I enjoy exploring the systems around them — <tspan fill="#8EADB6">architecture, data flows, failure handling, observability,</tspan></text>
  <text x="110" y="244" fill="#EEF7EF">and the engineering decisions that make software dependable.</text>

  <text x="110" y="288" fill="#EEF7EF">Outside work, I build applied AI projects and open-source developer tools, experiment with new</text>
  <text x="110" y="310" fill="#EEF7EF">engineering approaches, and write about the lessons and trade-offs behind them.</text>

  <text x="110" y="354" fill="#EEF7EF">I'm the kind of engineer who wants to understand <tspan fill="#B6FF3B" font-weight="700">why something works, what happens when it fails,</tspan></text>
  <text x="110" y="376" font-weight="700" fill="#B6FF3B">and how it can be designed better.<tspan fill="#8EADB6" font-weight="400">_</tspan></text>
</g>

